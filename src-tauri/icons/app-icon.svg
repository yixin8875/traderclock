<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#182842"/>
      <stop offset="0.52" stop-color="#0C1526"/>
      <stop offset="1" stop-color="#060A12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.16" r="0.82">
      <stop offset="0" stop-color="#F3A72B" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#F3A72B" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#F3A72B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#FFE0A0"/>
      <stop offset="0.38" stop-color="#F7AE33"/>
      <stop offset="0.72" stop-color="#E08C10"/>
      <stop offset="1" stop-color="#B96A05"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CBD8EC"/>
    </linearGradient>
    <radialGradient id="face" cx="0.5" cy="0.4" r="0.66">
      <stop offset="0" stop-color="#2C4166"/>
      <stop offset="0.72" stop-color="#16233A"/>
      <stop offset="1" stop-color="#0E1728"/>
    </radialGradient>
    <filter id="ringGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="handShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 底板 -->
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>
  <rect x="14" y="14" width="996" height="996" rx="220" fill="none" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="3"/>

  <!-- 表盘内圈 -->
  <circle cx="512" cy="512" r="300" fill="url(#face)"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="4"/>

  <!-- 主金色表圈 -->
  <circle cx="512" cy="512" r="348" fill="none" stroke="url(#gold)" stroke-width="52" filter="url(#ringGlow)"/>

  <!-- 刻度 -->
  <g stroke="#E6EEFB" stroke-linecap="round">
    <g stroke-opacity="0.95" stroke-width="20">
      <path d="M512 268 V310"/>
      <path d="M756 512 H714"/>
      <path d="M512 756 V714"/>
      <path d="M268 512 H310"/>
    </g>
    <g stroke-opacity="0.55" stroke-width="14">
      <path d="M634 289 L621 329"/>
      <path d="M735 390 L695 403"/>
      <path d="M735 634 L695 621"/>
      <path d="M634 735 L621 695"/>
      <path d="M390 735 L403 695"/>
      <path d="M289 634 L329 621"/>
      <path d="M289 390 L329 403"/>
      <path d="M390 289 L403 329"/>
    </g>
  </g>

  <!-- 指针：10 点方向的时针 + 2 点方向的金色分针，形成上扬的 V -->
  <g filter="url(#handShadow)" stroke-linecap="round">
    <path d="M512 512 L379 434" stroke="url(#steel)" stroke-width="48"/>
    <path d="M512 512 L700 404" stroke="url(#steel)" stroke-width="44"/>
  </g>

  <!-- 轴心 -->
  <circle cx="512" cy="512" r="42" fill="url(#gold)"/>
  <circle cx="512" cy="512" r="17" fill="#0A1120"/>
</svg>
