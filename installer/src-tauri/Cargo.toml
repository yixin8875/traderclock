[package]
name = "tradeclock-setup"
version = "0.1.0"
description = "TradeClock animated installer"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.5.1", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
